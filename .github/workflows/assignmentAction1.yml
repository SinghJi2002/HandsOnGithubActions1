name: Lint-Test-Deploy
on: push
jobs:
  LintJob:
    runs-on: windows-latest
    steps:
      - name: Transfer Repo To VM
        uses: actions/checkout@v6.1.0
      - name: Installing Node Dependencies
        run: npm ci
      - name: Run The Lint Command
        run: npm run lint
  
  TestJob:
    needs: LintJob
    runs-on: windows-latest
    steps:
      - name: Transfer Repo To VM
        uses: actions/checkout@v6.1.0
      - name: Installing Node Dependencies
        run: npm ci
      - name: Run The Test Command
        run: npm run test  
  
  BuildJob:
    needs: TestJob
    runs-on: windows-latest
    steps: 
      - name: Transfer Repo To VM
        uses: actions/checkout@v6.1.0
      - name: Installing Node Dependencies
        run: npm ci
      - name: Run the Build Command
        run: npm run build